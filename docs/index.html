<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effra Stats</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --fg: #1a1a1a; --muted: #6b6b6b;
    --card: #ffffff; --border: #e2e2e2; --accent: #1d6f42;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #eaeaea; --muted: #9a9a9a; --card: #1c1c1c; --border: #303030; --accent: #4caf7d; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  header { padding: 32px 20px 16px; max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
  select#year-select,
  select#player-select,
  select#gw-select,
  select#pair-select {
    width: 100%; padding: 12px 14px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--fg);
    margin-bottom: 8px;
  }
  main { max-width: 720px; margin: 0 auto; padding: 0 20px 60px; }
  .card {
    margin-top: 16px; padding: 18px 20px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  }
  .name { font-size: 1.3rem; font-weight: 600; margin-bottom: 10px; }
  .stats { color: var(--muted); font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 16px; }
  .stats b { color: var(--fg); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 16px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .result-W { color: var(--accent); font-weight: 600; }
  .result-L { color: #c0392b; font-weight: 600; }
  .result-D { color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); padding: 20px 0; }
  [hidden] { display: none !important; }
  h3 { font-size: 0.95rem; margin: 20px 0 0; }
  .table-scroll { max-height: 360px; overflow-y: auto; }
  .table-scroll thead th { position: sticky; top: 0; background: var(--card); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  td.num, th.num { text-align: right; }
  .muted { color: var(--muted); }
  .scoreline { display: flex; align-items: baseline; gap: 12px; font-size: 1.1rem; margin: 2px 0 6px; }
  .scoreline b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .teams { display: flex; gap: 20px; flex-wrap: wrap; }
  .team { flex: 1; min-width: 220px; }
  .team-head { display: flex; justify-content: space-between; margin-top: 12px; font-weight: 600; font-size: 0.9rem; }
  .team table { margin-top: 6px; }
  .cap { display: inline-block; font-size: 0.7rem; font-weight: 700; line-height: 1; padding: 2px 4px;
         border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; vertical-align: 1px; }
  .og { color: var(--muted); font-size: 0.8rem; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>Effra Stats</h1>
  <div class="sub">Pick a season, then a player or a gameweek.</div>
  <select id="year-select" aria-label="Select a season">
    <option value="all">All seasons</option>
  </select>
  <div class="sub" style="margin-top:20px;">Pick a player to see their record.</div>
  <select id="player-select">
    <option value="">Select a player...</option>
  </select>
  <div id="pair-wrap" hidden>
    <select id="pair-select" aria-label="Pair with another player">
      <option value="">Pair with...</option>
    </select>
  </div>
  <div class="sub" style="margin-top:20px;">Or pick a gameweek to see the match.</div>
  <select id="gw-select">
    <option value="">Select a gameweek...</option>
  </select>
</header>
<main>
  <div id="player-detail"></div>
  <div id="pair-detail"></div>
  <div id="gw-detail"></div>
</main>

<script>
let players = [];
let matches = [];
let selectedYear = 'all';

fetch('players.json').then(r => r.json()).then(data => {
  players = data;
  rebuildYearOptions();
  populatePlayerOptions();
  updatePlayerDetail();
});

fetch('matches.json').then(r => r.json()).then(data => {
  matches = data;
  populateGwOptions();
  updateMatchDetail();
  // Pairings are derived from match rosters, so refresh once they arrive.
  populatePairOptions();
  updatePlayerDetail();
});

function rebuildYearOptions() {
  const yearSet = new Set();
  for (const p of players) {
    for (const g of p.games || []) {
      if (g.year != null) yearSet.add(String(g.year));
    }
  }
  const yearSelect = document.getElementById('year-select');
  const years = Array.from(yearSet).sort((a, b) => Number(a) - Number(b));
  const current = yearSelect.value || 'all';
  yearSelect.innerHTML = '<option value="all">All seasons</option>' + years.map(y => `<option value="${y}">${y}</option>`).join('');
  yearSelect.value = years.includes(current) ? current : 'all';
  selectedYear = yearSelect.value;
}

function getVisiblePlayers() {
  if (selectedYear === 'all') return players;
  return players.filter(p => (p.games || []).some(g => String(g.year) === selectedYear));
}

function getVisibleMatches() {
  if (selectedYear === 'all') return matches;
  return matches.filter(m => String(m.year) === selectedYear);
}

function populatePlayerOptions() {
  const select = document.getElementById('player-select');
  const previous = select.value;
  const visible = getVisiblePlayers().slice().sort((a, b) => a.name.localeCompare(b.name));
  select.innerHTML = '<option value="">Select a player...</option>' + visible.map(p => `<option value="${escapeHtmlAttribute(p.name)}">${escapeHtml(p.name)}</option>`).join('');
  select.value = visible.some(p => p.name === previous) ? previous : '';
}

// GW numbers restart each season, so a match is identified by year + GW.
function matchKey(m) {
  return `${m.year ?? ''}-${m.gw}`;
}

function populateGwOptions() {
  const select = document.getElementById('gw-select');
  const previous = select.value;
  const showYear = selectedYear === 'all';
  const visible = getVisibleMatches().slice()
    .sort((a, b) => (Number(a.year) || 0) - (Number(b.year) || 0) || a.gw - b.gw);
  select.innerHTML = '<option value="">Select a gameweek...</option>' + visible.map(m =>
    `<option value="${matchKey(m)}">${showYear && m.year ? `${m.year} ` : ''}GW${m.gw}</option>`).join('');
  select.value = visible.some(m => matchKey(m) === previous) ? previous : '';
}

document.getElementById('year-select').addEventListener('change', (e) => {
  selectedYear = e.target.value;
  populatePlayerOptions();
  populateGwOptions();
  populatePairOptions();
  updatePlayerDetail();
  updateMatchDetail();
});

document.getElementById('player-select').addEventListener('change', () => {
  populatePairOptions();
  updatePlayerDetail();
});

document.getElementById('pair-select').addEventListener('change', () => {
  updatePairDetail();
});

// Clicking a row in the pairings table selects that player in "Pair with".
document.getElementById('player-detail').addEventListener('click', (e) => {
  const row = e.target.closest('tr[data-pair]');
  if (!row) return;
  const pairSelect = document.getElementById('pair-select');
  pairSelect.value = row.dataset.pair;
  updatePairDetail();
  document.getElementById('pair-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// ---- Pairings: derived from match rosters, respecting the season filter ----

const NON_PLAYERS = new Set(['og', 'own goal']);

function rosterNames(list) {
  return (list || []).map(p => p.player).filter(n => n && !NON_PLAYERS.has(n.trim().toLowerCase()));
}

function sideOf(m, name) {
  if (rosterNames(m.team1_players).includes(name)) return 1;
  if (rosterNames(m.team2_players).includes(name)) return 2;
  return 0;
}

function resultFor(m, side) {
  return side === 1 ? m.team1_result : m.team2_result;
}

function emptyRecord() {
  return { n: 0, W: 0, D: 0, L: 0 };
}

function addResult(rec, result) {
  rec.n += 1;
  if (result === 'W' || result === 'D' || result === 'L') rec[result] += 1;
}

function winPct(rec) {
  return rec.n ? Math.round((rec.W / rec.n) * 100) : null;
}

function fmtPct(rec) {
  const pct = winPct(rec);
  return pct == null ? '-' : `${pct}%`;
}

function fmtWDL(rec) {
  return `${rec.W}-${rec.D}-${rec.L}`;
}

// For one player: per other-player record with them (same side) and against
// them (opposite side), both from the selected player's perspective.
function computePairings(name) {
  const byName = new Map();
  const get = (other) => {
    if (!byName.has(other)) byName.set(other, { name: other, with: emptyRecord(), vs: emptyRecord() });
    return byName.get(other);
  };
  for (const m of getVisibleMatches()) {
    const side = sideOf(m, name);
    if (!side) continue;
    const result = resultFor(m, side);
    const mine = rosterNames(side === 1 ? m.team1_players : m.team2_players);
    const theirs = rosterNames(side === 1 ? m.team2_players : m.team1_players);
    for (const other of mine) if (other !== name) addResult(get(other).with, result);
    for (const other of theirs) addResult(get(other).vs, result);
  }
  return Array.from(byName.values());
}

function populatePairOptions() {
  const wrap = document.getElementById('pair-wrap');
  const select = document.getElementById('pair-select');
  const player = document.getElementById('player-select').value;
  const previous = select.value;
  if (!player) {
    wrap.hidden = true;
    select.innerHTML = '<option value="">Pair with...</option>';
    updatePairDetail();
    return;
  }
  const others = computePairings(player).map(p => p.name).sort((a, b) => a.localeCompare(b));
  select.innerHTML = `<option value="">Pair ${escapeHtml(player)} with...</option>` +
    others.map(n => `<option value="${escapeHtmlAttribute(n)}">${escapeHtml(n)}</option>`).join('');
  select.value = others.includes(previous) ? previous : '';
  wrap.hidden = false;
  updatePairDetail();
}

function updatePairDetail() {
  const player = document.getElementById('player-select').value;
  const other = document.getElementById('pair-select').value;
  document.getElementById('pair-detail').innerHTML = player && other ? renderPair(player, other) : '';
}

function seasonLabel() {
  return selectedYear === 'all' ? 'all seasons' : `season ${selectedYear}`;
}

function gwLabel(item) {
  return `${selectedYear === 'all' && item.year ? `${item.year} ` : ''}GW${item.gw}`;
}

function byYearThenGw(a, b) {
  return (Number(a.year) || 0) - (Number(b.year) || 0) || a.gw - b.gw;
}

function renderPairingsTable(name) {
  const rows = computePairings(name)
    .sort((a, b) => (b.with.n + b.vs.n) - (a.with.n + a.vs.n) || a.name.localeCompare(b.name));
  if (!rows.length) return '';
  return `
    <h3>Pairings</h3>
    <div class="sub" style="margin:4px 0 0;">${escapeHtml(name)}'s record with and against each player. Tap a row to pair up.</div>
    <div class="table-scroll">
      <table>
        <thead><tr>
          <th>Player</th>
          <th class="num">With</th><th class="num">W-D-L</th><th class="num">Win%</th>
          <th class="num">Vs</th><th class="num">W-D-L</th><th class="num">Win%</th>
        </tr></thead>
        <tbody>${rows.map(r => `
          <tr class="clickable" data-pair="${escapeHtmlAttribute(r.name)}">
            <td>${escapeHtml(r.name)}</td>
            <td class="num">${r.with.n}</td><td class="num">${fmtWDL(r.with)}</td><td class="num">${fmtPct(r.with)}</td>
            <td class="num">${r.vs.n}</td><td class="num">${fmtWDL(r.vs)}</td><td class="num">${fmtPct(r.vs)}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>
  `;
}

function renderPair(a, b) {
  const together = emptyRecord();
  const against = emptyRecord();
  let goalsTogether = 0;
  const shared = [];
  for (const m of getVisibleMatches()) {
    const sa = sideOf(m, a);
    const sb = sideOf(m, b);
    if (!sa || !sb) continue;
    const result = resultFor(m, sa);
    if (sa === sb) {
      addResult(together, result);
      const list = sa === 1 ? m.team1_players : m.team2_players;
      goalsTogether += list.filter(p => p.player === a || p.player === b)
        .reduce((sum, p) => sum + (p.goals || 0), 0);
    } else {
      addResult(against, result);
    }
    shared.push({ year: m.year, gw: m.gw, same: sa === sb, result, venue: m.venue });
  }
  const rows = shared.sort(byYearThenGw).map(g => `
    <tr>
      <td>${gwLabel(g)}</td>
      <td>${g.same ? 'Together' : 'Against'}</td>
      <td class="result-${g.result || ''}">${g.result || '-'}</td>
      <td>${escapeHtml(g.venue || '')}</td>
    </tr>`).join('');
  return `
    <div class="card">
      <div class="name">${escapeHtml(a)} &amp; ${escapeHtml(b)} <span style="color: var(--muted); font-size: 0.8rem; font-weight: 400;">(${seasonLabel()})</span></div>
      <div class="stats">
        <span>Together: <b>${together.n}</b> games, W <b>${together.W}</b> D <b>${together.D}</b> L <b>${together.L}</b>, <b>${fmtPct(together)}</b> win rate, <b>${goalsTogether}</b> goals between them</span>
      </div>
      <div class="stats" style="margin-top:8px;">
        <span>Against: <b>${against.n}</b> games, ${escapeHtml(a)} W <b>${against.W}</b> D <b>${against.D}</b> L <b>${against.L}</b> (<b>${fmtPct(against)}</b>)</span>
      </div>
      ${shared.length ? `
      <table>
        <thead><tr><th>GW</th><th>Side</th><th>${escapeHtml(a)}</th><th>Venue</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : '<div class="empty">No shared games this season.</div>'}
    </div>
  `;
}

document.getElementById('gw-select').addEventListener('change', () => {
  updateMatchDetail();
});

function updatePlayerDetail() {
  const select = document.getElementById('player-select');
  const p = players.find(p => p.name === select.value);
  document.getElementById('player-detail').innerHTML = p ? renderCard(p) : '';
}

function updateMatchDetail() {
  const select = document.getElementById('gw-select');
  const m = getVisibleMatches().find(m => matchKey(m) === select.value);
  document.getElementById('gw-detail').innerHTML = m ? renderMatch(m) : '';
}

function renderMatch(m) {
  const isOG = (p) => NON_PLAYERS.has(String(p.player || '').trim().toLowerCase());
  const cell = (v) => v ? v : '<span class="muted">&middot;</span>';
  const team = (label, result, list) => {
    const players = (list || []).filter(p => !isOG(p));
    const ownGoals = (list || []).filter(isOG).reduce((sum, p) => sum + (p.goals || 0), 0);
    return `
      <div class="team">
        <div class="team-head"><span>${label}</span><span class="result-${result || ''}">${result ? ({ W: 'Won', D: 'Drew', L: 'Lost' }[result] || result) : ''}</span></div>
        <table>
          <thead><tr><th>Player</th><th class="num">G</th><th class="num">A</th><th class="num">CS</th></tr></thead>
          <tbody>${players.map(p => `
            <tr>
              <td>${escapeHtml(p.player)}${p.is_captain ? ' <span class="cap" title="Captain">C</span>' : ''}</td>
              <td class="num">${cell(p.goals)}</td>
              <td class="num">${cell(p.assists)}</td>
              <td class="num">${cell(p.clean_sheets)}</td>
            </tr>
          `).join('')}</tbody>
        </table>
        ${ownGoals ? `<div class="og">+ ${ownGoals} own goal${ownGoals === 1 ? '' : 's'}</div>` : ''}
      </div>
    `;
  };
  return `
    <div class="card">
      <div class="name">${m.year ? `${m.year} ` : ''}GW${m.gw}${m.venue ? ` &middot; ${escapeHtml(m.venue)}` : ''}</div>
      <div class="scoreline">
        <span class="result-${m.team1_result || ''}">Team 1</span>
        <b>${m.team1_goals ?? '-'} &ndash; ${m.team2_goals ?? '-'}</b>
        <span class="result-${m.team2_result || ''}">Team 2</span>
      </div>
      <div class="teams">
        ${team('Team 1', m.team1_result, m.team1_players)}
        ${team('Team 2', m.team2_result, m.team2_players)}
      </div>
    </div>
  `;
}

function renderCard(p) {
  const games = selectedYear === 'all' ? (p.games || []) : (p.games || []).filter(g => String(g.year) === selectedYear);
  const appearances = games.length || 0;
  const goals = games.reduce((sum, g) => sum + (g.goals || 0), 0);
  const assists = games.reduce((sum, g) => sum + (g.assists || 0), 0);
  const cleanSheets = games.reduce((sum, g) => sum + (g.clean_sheets || 0), 0);
  const wins = games.filter(g => g.result === 'W').length;
  const draws = games.filter(g => g.result === 'D').length;
  const losses = games.filter(g => g.result === 'L').length;
  const gpg = appearances ? (goals / appearances).toFixed(2) : '0.00';
  const winRate = appearances ? Math.round((wins / appearances) * 100) : 0;
  const captained = emptyRecord();
  for (const g of games) if (g.is_captain) addResult(captained, g.result);
  const rows = games.slice().sort(byYearThenGw).map(g => `
    <tr>
      <td>${gwLabel(g)}</td>
      <td class="result-${g.result || ''}">${g.result || '-'}</td>
      <td>${g.goals ?? '-'}</td>
      <td>${g.assists ?? '-'}</td>
      <td>${g.clean_sheets ?? '-'}</td>
      <td>${g.is_captain ? 'C' : ''}</td>
      <td>${escapeHtml(g.venue || '')}</td>
    </tr>
  `).join('');
  return `
    <div class="card">
      <div class="name">${escapeHtml(p.name)} <span style="color: var(--muted); font-size: 0.8rem; font-weight: 400;">(${seasonLabel()})</span></div>
      <div class="stats">
        <span><b>${appearances}</b> apps</span>
        <span><b>${goals}</b> goals</span>
        <span><b>${assists}</b> assists</span>
        <span><b>${gpg}</b> goals/game</span>
        <span><b>${winRate}%</b> win rate</span>
        <span>W <b>${wins}</b> D <b>${draws}</b> L <b>${losses}</b></span>
        <span><b>${cleanSheets}</b> clean sheets</span>
      </div>
      <div class="stats" style="margin-top:8px;">
        <span><b>${captained.n}</b> captaincies</span>
        ${captained.n ? `
        <span>as captain W <b>${captained.W}</b> D <b>${captained.D}</b> L <b>${captained.L}</b></span>
        <span><b>${fmtPct(captained)}</b> captaincy win rate</span>` : ''}
      </div>
      ${renderPairingsTable(p.name)}
      <h3>Games</h3>
      <table>
        <thead><tr><th>GW</th><th>Res</th><th>G</th><th>A</th><th>CS</th><th>C</th><th>Venue</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function escapeHtml(value) {
  if (value == null) return '';
  const text = String(value);
  return text.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function escapeHtmlAttribute(value) {
  return escapeHtml(value);
}
</script>
</body>
</html>
