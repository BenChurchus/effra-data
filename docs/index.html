<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Effra Rovers FC · Stats</title>
<meta name="description" content="Player records, pairings and match results for Effra Rovers FC 5-a-side, 2024 to today.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Effra Rovers FC · Stats">
<meta property="og:description" content="Player records, pairings and match results.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://benchurchus.github.io/effra-data/assets/crest.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>/* apply saved theme before first paint (no flash) */
try { var t = localStorage.getItem('effra-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="stylesheet" href="effra.css">
<script src="effra.js" defer></script>
<script src="charts.js" defer></script>
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <img src="assets/icon-192.png" alt="Effra Rovers FC crest" width="48" height="48">
      <div class="grow">
        <h1>Effra Rovers FC</h1>
        <div class="tag">5-a-side stats · since 2023</div>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle"></button>
    </div>
    <div class="header-row">
      <div class="tabs" role="tablist" aria-label="Section">
        <button type="button" role="tab" id="tab-table" aria-controls="panel-table" aria-selected="false">Leaderboard</button>
        <button type="button" role="tab" id="tab-players" aria-controls="panel-players" aria-selected="true">Players</button>
        <button type="button" role="tab" id="tab-matches" aria-controls="panel-matches" aria-selected="false">Matches</button>
      </div>
      <div class="seg" id="season-seg" role="group" aria-label="Season"></div>
    </div>
  </div>
</header>

<main id="main" class="wrap">
  <div id="status" class="empty-state" role="status">Loading stats…</div>

  <section id="panel-table" role="tabpanel" aria-labelledby="tab-table" hidden>
    <article class="card">
      <div class="card-head">
        <h2 id="table-title">Leaderboard</h2>
        <div class="seg in-card" id="board-seg" role="group" aria-label="Leaderboard view">
          <button type="button" data-board="players">Players</button>
          <button type="button" data-board="pairs">Pairings</button>
          <button type="button" data-board="rivals">Nemesis</button>
        </div>
      </div>
      <label class="sub" style="display:block;margin-top:8px"><input type="checkbox" id="table-qualified" checked> <span id="table-qual-label">Regulars only</span></label>
      <div class="sub" id="board-help" style="margin-top:4px">Click any column to re-order · tap a row to open it.</div>
      <div class="table-wrap" id="leaderboard" style="margin-top:10px"></div>
    </article>
  </section>

  <section id="panel-players" role="tabpanel" aria-labelledby="tab-players" hidden>
    <div class="pickers two">
      <label class="field">Player
        <select id="player-select"><option value="">Choose a player…</option></select>
      </label>
      <label class="field" id="pair-field" hidden>Pair with
        <select id="pair-select"><option value="">Compare with another player…</option></select>
      </label>
    </div>
    <div id="player-view"></div>
  </section>

  <section id="panel-matches" role="tabpanel" aria-labelledby="tab-matches" hidden>
    <div class="nav-row">
      <button type="button" class="btn" id="gw-prev" aria-label="Previous match">‹</button>
      <label class="field">Gameweek
        <select id="gw-select"><option value="">Choose a gameweek…</option></select>
      </label>
      <button type="button" class="btn" id="gw-next" aria-label="Next match">›</button>
    </div>
    <div id="match-view"></div>
  </section>
</main>

<footer class="site">Effra Rovers FC · data from the weekly scorecards · <span id="data-stamp"></span>
  <br><a class="gaffer" href="master.html" rel="nofollow" title="Gaffer’s room: awards and master sheet">🏆 <span>Gaffer</span></a>
</footer>
<noscript><p class="wrap">This page needs JavaScript to load the stats.</p></noscript>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';
  const E = window.Effra, C = window.EffraCharts, esc = E.escapeHtml, fmt = E.fmt;
  const $ = (id) => document.getElementById(id);

  let allMatches = [];
  const TABS = ['table', 'players', 'matches'];
  const BOARDS = ['players', 'pairs', 'rivals'];
  const state = { tab: 'players', year: 'all', player: '', pair: '', gw: '', board: 'players' };
  E.mountThemeToggle($('theme-toggle'));
  const cache = new Map();

  // ------------------------------------------------------------ data scope
  function scope() {
    if (!cache.has(state.year)) {
      const matches = E.filterBySeason(allMatches, state.year);
      const players = E.buildPlayers(matches);
      const pairs = E.buildPairs(matches);
      E.addImpact(players, pairs);
      const t = E.defaultThresholds(matches.length);
      cache.set(state.year, { matches, players, pairs, t, byName: new Map(players.map(p => [p.name, p])) });
    }
    return cache.get(state.year);
  }
  const allSeasons = () => state.year === 'all';
  const seasonText = () => (allSeasons() ? 'All seasons' : `${state.year} season`);
  const shortGw = (g) => (allSeasons() && g.year ? `’${String(g.year).slice(2)} GW${g.gw}` : `GW${g.gw}`);

  // ------------------------------------------------------- URL deep links
  function readHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    state.tab = TABS.includes(h.get('tab')) ? h.get('tab') : 'players';
    state.year = h.get('y') || state.year;
    state.player = h.get('p') || '';
    state.pair = h.get('with') || '';
    state.gw = h.get('gw') || '';
    state.board = BOARDS.includes(h.get('b')) ? h.get('b') : 'players';
  }
  function writeHash() {
    const h = new URLSearchParams();
    h.set('tab', state.tab);
    h.set('y', state.year);
    if (state.tab === 'players' && state.player) h.set('p', state.player);
    if (state.tab === 'players' && state.player && state.pair) h.set('with', state.pair);
    if (state.tab === 'matches' && state.gw) h.set('gw', state.gw);
    if (state.tab === 'table' && state.board !== 'players') h.set('b', state.board);
    history.replaceState(null, '', `#${h.toString()}`);
  }

  // -------------------------------------------------------------- chrome
  function renderSeasons() {
    const years = E.seasons(allMatches).map(String);
    if (state.year !== 'all' && !years.includes(state.year)) state.year = years[years.length - 1] || 'all';
    $('season-seg').innerHTML = [...years, 'all'].map(y =>
      `<button type="button" data-year="${y}" aria-pressed="${state.year === y}">${y === 'all' ? 'All' : y}</button>`).join('');
  }
  function renderTabs() {
    for (const t of TABS) {
      $(`tab-${t}`).setAttribute('aria-selected', String(state.tab === t));
      $(`panel-${t}`).hidden = state.tab !== t;
    }
  }

  // ------------------------------------------------------------- players
  function renderPlayerPickers() {
    const s = scope();
    const names = s.players.map(p => p.name);
    if (state.player && !names.includes(state.player)) { state.player = ''; state.pair = ''; }
    $('player-select').innerHTML = '<option value="">Choose a player…</option>' +
      names.map(n => `<option value="${esc(n)}" ${n === state.player ? 'selected' : ''}>${esc(n)}</option>`).join('');
    // "Pair with" only exists once an individual is up
    $('pair-field').hidden = !state.player;
    if (!state.player) { state.pair = ''; return; }
    const others = E.pairingsFor(s.pairs, state.player).map(p => p.other).sort((a, b) => a.localeCompare(b));
    if (state.pair && !others.includes(state.pair)) state.pair = '';
    $('pair-select').innerHTML = `<option value="">Compare ${esc(state.player)} with…</option>` +
      others.map(n => `<option value="${esc(n)}" ${n === state.pair ? 'selected' : ''}>${esc(n)}</option>`).join('');
  }

  const kpi = (label, value, meta = '', tone = '') =>
    `<div class="kpi ${tone}"><div class="label">${label}</div><div class="value">${value}</div>${meta ? `<div class="meta">${meta}</div>` : ''}</div>`;
  // tone for a rate: green above 55%, red below 45%, neutral blue between
  const toneFor = (v) => (v == null ? '' : v >= 0.55 ? 'good' : v < 0.45 ? 'bad' : '');

  // ----------------------------------------------------------- leaderboard
  function renderLeaderboard() {
    for (const b of $('board-seg').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.board === state.board));
    $('table-title').textContent = `${({ players: 'Leaderboard', pairs: 'Pairings', rivals: 'Nemesis' })[state.board]} · ${seasonText()}`;
    if (state.board === 'pairs') return renderPairBoard();
    if (state.board === 'rivals') return renderRivalBoard();
    const s = scope();
    const qOnly = $('table-qualified').checked;
    $('table-qual-label').textContent = `Regulars only (${s.t.minApps}+ apps)`;
    $('board-help').textContent = 'Click any column to re-order · tap a player to open their record.';
    const rows = s.players.filter(p => !qOnly || p.apps >= s.t.minApps);
    E.sortableTable($('leaderboard'), [
      { key: 'name', label: 'Player', sticky: true, value: p => p.name, html: p => `<b>${esc(p.name)}</b>` },
      { key: 'apps', label: 'Apps', num: true, value: p => p.apps },
      { key: 'rec', label: 'Record', value: p => p.rec.W - p.rec.L, html: p => fmt.wdlHtml(p.rec) },
      { key: 'win', label: 'Win %', num: true, value: p => p.winPct, html: p => fmt.meterHtml(p.winPct) },
      { key: 'g', label: 'Goals', num: true, value: p => p.goals },
      { key: 'gpg', label: 'G/gm', num: true, value: p => p.gpg, html: p => fmt.pg(p.gpg) },
      { key: 'a', label: 'Assists', num: true, value: p => p.assists },
      { key: 'apg', label: 'A/gm', num: true, value: p => p.apg, html: p => fmt.pg(p.apg) },
      { key: 'cs', label: 'CS', num: true, title: 'Clean sheets', value: p => p.cs },
      { key: 'csp', label: 'CS %', num: true, title: 'Share of games with a clean sheet', value: p => p.csPct, html: p => fmt.pct(p.csPct) },
      { key: 'cap', label: 'Capt win %', num: true, value: p => p.capWinPct, html: p => (p.cap.n ? `${fmt.pct(p.capWinPct)} <span class="muted">(${p.cap.n})</span>` : '–') },
      { key: 'impact', label: 'Impact', num: true, title: 'Win % minus team-mates’ win % without them', value: p => p.impact,
        html: p => (p.impact == null ? '–' : `<span class="${p.impact >= 0 ? 'r-W' : 'r-L'}">${fmt.signedPct(p.impact)}</span>`) },
      { key: 'form', label: 'Form', value: p => p.games.slice(-5).filter(g => g.result === 'W').length, html: p => formStrip(p.games, 5) },
    ], rows, { sortKey: 'win', rowAttrs: p => `class="clickable" data-player="${esc(p.name)}" tabindex="0"` });
  }

  const pairLabel = (a, b) => `<b>${esc(a)}</b><span class="vs-word">&amp;</span><b>${esc(b)}</b>`;

  function renderPairBoard() {
    const s = scope();
    const qOnly = $('table-qualified').checked;
    const min = qOnly ? s.t.minPairGames : 1;
    $('table-qual-label').textContent = `Established pairs only (${s.t.minPairGames}+ games together)`;
    $('board-help').textContent = 'Best partnerships first; flip Win % for the worst · tap a pair to compare them.';
    const rows = s.pairs.filter(p => E.decided(p.with) >= min);
    E.sortableTable($('leaderboard'), [
      { key: 'pair', label: 'Pair', sticky: true, value: p => `${p.a} ${p.b}`, html: p => pairLabel(p.a, p.b) },
      { key: 'win', label: 'Win %', num: true, value: p => p.withPct, html: p => fmt.meterHtml(p.withPct) },
      { key: 'n', label: 'Games', num: true, value: p => p.with.n },
      { key: 'rec', label: 'Record', value: p => p.with.W - p.with.L, html: p => fmt.wdlHtml(p.with) },
      { key: 'goals', label: 'Goals', num: true, title: 'Goals between them when together', value: p => p.withGoals },
      { key: 'gpg', label: 'Goals/gm', num: true, value: p => p.withGpg, html: p => fmt.pg(p.withGpg) },
    ], rows, { sortKey: 'win', rowAttrs: p => `class="clickable" data-player="${esc(p.a)}" data-with="${esc(p.b)}" tabindex="0"` });
  }

  // How unlikely is a head-to-head record to be luck (two-sided binomial p)?
  const verdict = (p, n) => (n < 3 ? '<span class="verdict luck">Too early</span>'
    : p < 0.05 ? '<span class="verdict sig">Nemesis</span>'
    : p < 0.2 ? '<span class="verdict lean">Has the edge</span>'
    : '<span class="verdict luck">Could be luck</span>');

  function renderRivalBoard() {
    const s = scope();
    const qOnly = $('table-qualified').checked;
    const min = qOnly ? s.t.minVsGames : 1;
    $('table-qual-label').textContent = `Proper rivalries only (${s.t.minVsGames}+ decided games against each other)`;
    $('board-help').textContent = 'Ranked by how unlikely the record is to be luck (exact binomial test, draws excluded) · tap to compare.';
    const rows = s.pairs
      .filter(p => p.vs.aW + p.vs.bW >= min)
      .map(p => {
        const aLeads = p.vs.aW >= p.vs.bW;
        const top = aLeads ? p.a : p.b, under = aLeads ? p.b : p.a;
        const rec = { n: p.vs.n, W: aLeads ? p.vs.aW : p.vs.bW, D: p.vs.D, L: aLeads ? p.vs.bW : p.vs.aW };
        return { top, under, rec, pct: E.winRate(rec), p: p.vsP, decided: p.vs.aW + p.vs.bW, strength: -Math.log10(Math.max(p.vsP, 1e-12)) };
      });
    E.sortableTable($('leaderboard'), [
      { key: 'who', label: 'Rivalry', sticky: true, value: r => `${r.top} ${r.under}`, html: r => `<b>${esc(r.top)}</b><span class="vs-word">over</span>${esc(r.under)}` },
      { key: 'strength', label: 'Luck?', title: 'p-value: chance of a record this lopsided if they were evenly matched', value: r => r.strength,
        html: r => `${verdict(r.p, r.decided)} <span class="muted">p ${fmt.p(r.p)}</span>` },
      { key: 'n', label: 'Games', num: true, value: r => r.rec.n },
      { key: 'rec', label: `Record`, title: 'From the leader’s side', value: r => r.rec.W - r.rec.L, html: r => fmt.wdlHtml(r.rec) },
      { key: 'win', label: 'Win %', num: true, value: r => r.pct, html: r => fmt.meterHtml(r.pct) },
      { key: 'margin', label: 'Margin', num: true, title: 'Wins minus losses', value: r => r.rec.W - r.rec.L, html: r => `+${r.rec.W - r.rec.L}` },
    ], rows, { sortKey: 'strength', rowAttrs: r => `class="clickable" data-player="${esc(r.top)}" data-with="${esc(r.under)}" tabindex="0"` });
  }
  const resChip = (r) => `<span class="res ${r || 'none'}" aria-label="${({ W: 'Win', D: 'Draw', L: 'Loss' })[r] || 'No result'}">${r || '–'}</span>`;
  const formStrip = (games, n = 6) => `<span class="form">${games.slice(-n).map(g => resChip(g.result)).join('')}</span>`;

  // Radar axes: percentile against the qualified squad in scope
  const AXES = [
    { key: 'gpg', label: 'Goals/gm', show: v => `${fmt.pg(v)} goals/game` },
    { key: 'apg', label: 'Assists/gm', show: v => `${fmt.pg(v)} assists/game` },
    { key: 'cspg', label: 'Clean sh./gm', show: v => `${fmt.pg(v)} clean sheets/game` },
    { key: 'winPct', label: 'Win %', show: v => `${fmt.pct(v)} win rate` },
    { key: 'impact', label: 'Win impact', show: v => `${fmt.signedPct(v)} vs team-mates` },
  ];
  function percentile(pool, key, v) {
    if (v == null) return null;
    const vals = pool.map(p => p[key]).filter(x => x != null);
    if (!vals.length) return null;
    const below = vals.filter(x => x < v - 1e-12).length, same = vals.filter(x => Math.abs(x - v) <= 1e-12).length;
    return (below + 0.5 * same) / vals.length;
  }
  const median = (vals) => {
    const v = vals.filter(x => x != null).sort((a, b) => a - b);
    if (!v.length) return null;
    const m = Math.floor(v.length / 2);
    return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
  };
  const ordinal = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

  function renderPlayer() {
    const view = $('player-view');
    const s = scope();
    const p = s.byName.get(state.player);
    if (!p) {
      view.innerHTML = `<div class="card empty-state"><img src="assets/crest-grey.png" alt="">Choose a player to see their record, pairings and form.</div>`;
      return;
    }
    const other = state.pair ? s.byName.get(state.pair) : null;
    const pool = s.players.filter(x => x.apps >= s.t.minApps);
    const poolUsed = pool.length >= 3 ? pool : s.players;
    const st = p.streaks;

    view.innerHTML = `
      <article class="card" aria-labelledby="pname">
        <div class="card-head">
          <h2 id="pname">${esc(p.name)}</h2>
          <span class="sub">${seasonText()} · last ${Math.min(6, p.games.length)} ${formStrip(p.games)}</span>
        </div>
        <div class="kpis six">
          ${kpi('Appearances', p.apps, fmt.wdlHtml(p.rec))}
          ${kpi('Win rate', fmt.pct(p.winPct), `impact <span class="${(p.impact ?? 0) >= 0 ? 'r-W' : 'r-L'}">${fmt.signedPct(p.impact)}</span>`, toneFor(p.winPct))}
          ${kpi('Goals', p.goals, `${fmt.pg(p.gpg)} per game`, 'gold')}
          ${kpi('Assists', p.assists, `${fmt.pg(p.apg)} per game`)}
          ${kpi('Clean sheets', p.cs, `${fmt.pct(p.csPct)} of games · ${fmt.pg(p.cspg)}/game`)}
          ${kpi('Captain', p.cap.n ? fmt.pct(p.capWinPct) : '–', p.cap.n ? `${p.cap.n} caps · ${fmt.wdlHtml(p.cap)}` : 'never captained', p.cap.n ? toneFor(p.capWinPct) : '')}
        </div>
        <div class="chips">
          <span>Longest win streak <b>${st.win.length}</b></span>
          <span>Unbeaten run <b>${st.unbeaten.length}</b></span>
          <span>Scoring streak <b>${st.scoring.length}</b></span>
          <span>Losing streak <b>${st.loss.length}</b></span>
          ${st.current ? `<span>Current <b>${st.current.length}${st.current.result}</b></span>` : ''}
        </div>

        <div class="charts">
          <div class="chart" id="radar-wrap">
            <h3>Profile vs ${other ? esc(other.name) : 'squad'}</h3>
            ${C.legend([{ name: p.name, color: 'var(--series-1)' }, { name: other ? other.name : 'Squad median', color: 'var(--series-ref)' }])}
            <div id="radar"></div>
            <details class="table-view" open><summary>Show as table</summary><div class="table-wrap" id="radar-table"></div></details>
            <details class="explainer">
              <summary>How to read this</summary>
              <p>Each spoke is one stat, ranked against every regular this ${allSeasons() ? 'period' : 'season'}
                 (${poolUsed.length} players with ${s.t.minApps}+ apps). <b>Centre = bottom of the squad, edge = top,</b>
                 and the middle ring is the 50th percentile, an average regular. A bigger, rounder shape means
                 good at everything; a spiky shape means a specialist.</p>
              <p>The <span class="key" style="--k:var(--series-1)">blue shape</span> is ${esc(p.name)}.
                 The <span class="key" style="--k:var(--series-ref)">grey shape</span> is ${other ? esc(other.name) : 'the squad median, a perfectly average regular'}.
                 ${other ? '' : 'Pick someone in “Pair with” to compare against them instead.'}</p>
              <dl>
                <dt>Goals/gm, Assists/gm, Clean sh./gm</dt><dd>Totals divided by appearances, so part-timers aren’t punished.</dd>
                <dt>Win %</dt><dd>Wins ÷ games with a result.</dd>
                <dt>Win impact</dt><dd>Their win % minus the win % their team-mates manage <em>without</em> them. Positive means teams win more with them in.</dd>
              </dl>
              <p class="muted">Percentiles show rank, not size. Being 90th on goals means more goals per game than 90% of regulars; the table gives the actual numbers.</p>
            </details>
          </div>
          <div class="chart" id="line-wrap">
            <h3>Goals &amp; assists, cumulative</h3>
            ${C.legend([{ name: 'Goals', color: 'var(--series-1)' }, { name: 'Assists', color: 'var(--series-2)' }])}
            <div id="line"></div>
            <div class="sub" style="font-size:0.75rem">Hover, tap or use ← → for each game. Full list in Games below.</div>
          </div>
        </div>

        <div id="pair-card"></div>

        <h3>Pairings <span class="sub">· with and against everyone · tap a row to compare</span></h3>
        <div class="table-wrap tall" id="pairings"></div>

        <h3>Games</h3>
        <div class="table-wrap tall" id="games"></div>
      </article>`;

    // radar
    const pv = AXES.map(a => percentile(poolUsed, a.key, p[a.key]));
    const series = [
      other
        ? { name: other.name, color: 'var(--series-ref)', values: AXES.map(a => percentile(poolUsed, a.key, other[a.key])),
            display: AXES.map(a => `${a.show(other[a.key])} (${ordinal(Math.round(100 * (percentile(poolUsed, a.key, other[a.key]) ?? 0)))} pct)`), fillOpacity: 0.06 }
        : { name: 'Squad median', color: 'var(--series-ref)', values: AXES.map(() => 0.5), display: AXES.map(() => '50th percentile'), fillOpacity: 0.04 },
      { name: p.name, color: 'var(--series-1)', values: pv,
        display: AXES.map((a, i) => `${a.show(p[a.key])} (${pv[i] == null ? '–' : ordinal(Math.round(pv[i] * 100))} pct)`) },
    ];
    C.radarChart($('radar'), { axes: AXES, series, title: `${p.name} percentile profile` });
    const pctCell = (v) => (v == null ? '–' : `<span class="${v >= 0.67 ? 'r-W' : v < 0.33 ? 'r-L' : ''}">${ordinal(Math.round(v * 100))}</span>`);
    const ov = other ? AXES.map(a => percentile(poolUsed, a.key, other[a.key])) : [];
    $('radar-table').innerHTML = `<table class="data"><thead><tr><th>Stat</th><th class="num">${esc(p.name)}</th><th class="num">Rank</th>${other ? `<th class="num">${esc(other.name)}</th><th class="num">Rank</th>` : '<th class="num">Squad median</th>'}</tr></thead><tbody>${
      AXES.map((a, i) => `<tr><td>${a.label}</td><td class="num">${esc(a.show(p[a.key]).split(' ')[0])}</td><td class="num">${pctCell(pv[i])}</td>${
        other ? `<td class="num">${esc(a.show(other[a.key]).split(' ')[0])}</td><td class="num">${pctCell(ov[i])}</td>`
              : `<td class="num">${esc(a.show(median(poolUsed.map(x => x[a.key]))).split(' ')[0])}</td>`}</tr>`).join('')}</tbody></table>
      <div class="sub" style="font-size:0.72rem;margin-top:4px">Rank = percentile among regulars: <span class="r-W">top third</span>, middle, <span class="r-L">bottom third</span>.</div>`;

    // line
    let g = 0, a = 0;
    const cum = p.games.map(x => ({ g: (g += x.goals), a: (a += x.assists), x }));
    C.lineChart($('line'), {
      title: `${p.name} cumulative goals and assists`,
      points: p.games.map(x => ({ label: shortGw(x) })),
      series: [
        { name: 'Goals', color: 'var(--series-1)', values: cum.map(c => c.g) },
        { name: 'Assists', color: 'var(--series-2)', values: cum.map(c => c.a) },
      ],
      tooltipHtml: (i) => {
        const c = cum[i];
        return `<b>${esc(E.gwLabel(c.x))}</b> · ${({ W: 'Won', D: 'Drew', L: 'Lost' })[c.x.result] || 'No result'} ${c.x.teamGoals ?? ''}–${c.x.oppGoals ?? ''}<br>
          This game: ${c.x.goals}G ${c.x.assists}A<br>Running: <b>${c.g}</b> goals, <b>${c.a}</b> assists`;
      },
    });

    // pairings (sortable, per-game)
    const prs = E.pairingsFor(s.pairs, p.name);
    E.sortableTable($('pairings'), [
      { key: 'other', label: 'Player', value: r => r.other, html: r => esc(r.other) },
      { key: 'with', label: 'With', num: true, title: 'Games on the same team', value: r => r.with.n },
      { key: 'wwdl', label: 'Record', value: r => r.with.W - r.with.L, html: r => r.with.n ? fmt.wdlHtml(r.with) : '–' },
      { key: 'wpct', label: 'Win %', num: true, value: r => r.withPct, html: r => fmt.meterHtml(r.withPct) },
      { key: 'gpg', label: 'Goals/gm', num: true, title: 'Goals between you per game together', value: r => r.withGpg, html: r => r.with.n ? fmt.pg(r.withGpg) : '–' },
      { key: 'vs', label: 'Against', num: true, title: 'Games on opposite teams', value: r => r.vs.n },
      { key: 'vwdl', label: 'Record', value: r => r.vs.W - r.vs.L, html: r => r.vs.n ? fmt.wdlHtml(r.vs) : '–' },
      { key: 'vpct', label: 'Win %', num: true, value: r => r.vsPct, html: r => fmt.meterHtml(r.vsPct) },
    ], prs, { sortKey: 'with', rowAttrs: r => `class="clickable" data-pair="${esc(r.other)}" tabindex="0"` });

    // games
    E.sortableTable($('games'), [
      { key: 'when', label: 'Game', value: r => (Number(r.year) || 0) * 1000 + r.gw, html: r => esc(E.gwLabel(r, allSeasons())) },
      { key: 'res', label: 'Result', value: r => ({ W: 2, D: 1, L: 0 })[r.result] ?? -1, html: r => `${resChip(r.result)} <span class="muted">${r.teamGoals ?? ''}–${r.oppGoals ?? ''}</span>` },
      { key: 'g', label: 'G', num: true, value: r => r.goals, html: r => r.goals || '·' },
      { key: 'a', label: 'A', num: true, value: r => r.assists, html: r => r.assists || '·' },
      { key: 'cs', label: 'CS', num: true, value: r => r.cs, html: r => r.cs || '·' },
      { key: 'c', label: 'Capt', value: r => (r.captain ? 1 : 0), html: r => (r.captain ? '<span class="cap" title="Captain">C</span>' : '') },
      { key: 'v', label: 'Venue', value: r => r.venue || '', html: r => esc(r.venue || '') },
    ], p.games, { sortKey: 'when' });

    renderPairCard(p, other, prs);
  }

  function renderPairCard(p, other, prs) {
    const box = $('pair-card');
    if (!other) { box.innerHTML = ''; return; }
    const r = prs.find(x => x.other === other.name);
    if (!r) { box.innerHTML = ''; return; }
    const sig = r.vs.W + r.vs.L >= 3
      ? (r.vsP < 0.05 ? `significant (p = ${fmt.p(r.vsP)})` : `could be chance (p = ${fmt.p(r.vsP)})`)
      : 'too few games to judge';
    box.innerHTML = `
      <h3>${esc(p.name)} &amp; ${esc(other.name)}</h3>
      <div class="kpis">
        ${kpi('Together', `${r.with.n} <span class="muted" style="font-size:0.9rem;font-weight:500">games</span>`, r.with.n ? fmt.wdlHtml(r.with) : 'never teamed up')}
        ${kpi('Win rate together', fmt.pct(r.withPct), r.with.n ? `${r.withGoals} goals between them · ${fmt.pg(r.withGpg)}/game` : '', toneFor(r.withPct))}
        ${kpi(`${esc(p.name)} vs ${esc(other.name)}`, r.vs.n ? fmt.pct(r.vsPct) : '–', r.vs.n ? `${fmt.wdlHtml(r.vs)} in ${r.vs.n} · ${sig}` : 'never opposed', toneFor(r.vsPct))}
      </div>
      <details class="table-view" style="margin-top:10px"><summary>Shared games (${r.games.length})</summary>
        <div class="table-wrap"><table class="data"><thead><tr><th>Game</th><th>Side</th><th>${esc(p.name)}</th><th>Venue</th></tr></thead><tbody>${
          r.games.map(g => `<tr><td>${esc(E.gwLabel(g, allSeasons()))}</td><td>${g.together ? 'Together' : 'Against'}</td><td>${resChip(g.result)}</td><td>${esc(g.venue || '')}</td></tr>`).join('')
        }</tbody></table></div></details>`;
  }

  // ------------------------------------------------------------- matches
  function visibleMatches() {
    return scope().matches.slice().sort(E.byChrono);
  }
  function renderMatchPicker() {
    const list = visibleMatches();
    if (state.gw && !list.some(m => E.matchKey(m) === state.gw)) state.gw = '';
    if (!state.gw && list.length) state.gw = E.matchKey(list[list.length - 1]); // default: latest
    const opt = (m) => `<option value="${E.matchKey(m)}" ${E.matchKey(m) === state.gw ? 'selected' : ''}>GW${m.gw}${m.venue ? ` · ${esc(m.venue)}` : ''}</option>`;
    if (allSeasons()) {
      const years = E.seasons(list);
      $('gw-select').innerHTML = years.map(y => `<optgroup label="${y}">${list.filter(m => m.year === y).map(opt).join('')}</optgroup>`).join('');
    } else {
      $('gw-select').innerHTML = list.map(opt).join('');
    }
    const i = list.findIndex(m => E.matchKey(m) === state.gw);
    $('gw-prev').disabled = i <= 0;
    $('gw-next').disabled = i < 0 || i >= list.length - 1;
  }

  function renderMatch() {
    const view = $('match-view');
    const m = visibleMatches().find(x => E.matchKey(x) === state.gw);
    if (!m) { view.innerHTML = `<div class="card empty-state"><img src="assets/crest-grey.png" alt="">No matches in this season yet.</div>`; return; }
    const cell = (v) => (v ? v : '<span class="muted">·</span>');
    const team = (side) => {
      const list = E.roster(m, side);
      const og = E.ownGoals(m, side);
      const result = E.sideResult(m, side);
      return `<div>
        <div class="team-head"><span>Team ${side}</span><span class="r-${result || ''}">${({ W: 'Won', D: 'Drew', L: 'Lost' })[result] || ''}</span></div>
        <div class="table-wrap"><table class="data"><thead><tr><th>Player</th><th class="num">G</th><th class="num">A</th><th class="num">CS</th></tr></thead><tbody>${
          list.map(p => `<tr class="clickable" data-player="${esc(p.player)}" tabindex="0"><td>${esc(p.player)}${p.is_captain ? '<span class="cap" title="Captain">C</span>' : ''}</td><td class="num">${cell(p.goals)}</td><td class="num">${cell(p.assists)}</td><td class="num">${cell(p.clean_sheets)}</td></tr>`).join('')
        }</tbody></table></div>
        ${og ? `<div class="og">+ ${og} own goal${og === 1 ? '' : 's'}</div>` : ''}
      </div>`;
    };
    view.innerHTML = `
      <article class="card">
        <div class="card-head"><h2>${m.year ? `${m.year} ` : ''}GW${m.gw}</h2><span class="sub">${esc(m.venue || 'Venue not recorded')}</span></div>
        <div class="scoreline" aria-label="Team 1 ${m.team1_goals ?? '–'}, Team 2 ${m.team2_goals ?? '–'}">
          <span class="team-name r-${m.team1_result || ''}">Team 1</span>
          <span class="score">${m.team1_goals ?? '–'}–${m.team2_goals ?? '–'}</span>
          <span class="team-name r-${m.team2_result || ''}">Team 2</span>
        </div>
        <div class="teams">${team(1)}${team(2)}</div>
        <div class="sub" style="margin-top:10px">Tap a player to open their record.</div>
      </article>`;
  }

  // -------------------------------------------------------------- render
  function render() {
    renderSeasons();
    renderTabs();
    if (state.tab === 'players') { renderPlayerPickers(); renderPlayer(); }
    else if (state.tab === 'table') renderLeaderboard();
    else { renderMatchPicker(); renderMatch(); }
    writeHash();
  }

  // -------------------------------------------------------------- events
  $('season-seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-year]');
    if (!b) return;
    state.year = b.dataset.year;
    render();
  });
  for (const t of TABS) {
    $(`tab-${t}`).addEventListener('click', () => { state.tab = t; render(); });
  }
  $('tab-players').parentElement.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = TABS.indexOf(state.tab) + (e.key === 'ArrowRight' ? 1 : -1);
    state.tab = TABS[(i + TABS.length) % TABS.length];
    render();
    $(`tab-${state.tab}`).focus();
  });
  $('table-qualified').addEventListener('change', renderLeaderboard);
  $('board-seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-board]');
    if (!b) return;
    state.board = b.dataset.board;
    render();
  });
  $('player-select').addEventListener('change', (e) => { state.player = e.target.value; state.pair = ''; render(); });
  $('pair-select').addEventListener('change', (e) => { state.pair = e.target.value; render(); });
  $('gw-select').addEventListener('change', (e) => { state.gw = e.target.value; render(); });
  const step = (d) => {
    const list = visibleMatches();
    const i = list.findIndex(m => E.matchKey(m) === state.gw);
    const next = list[i + d];
    if (next) { state.gw = E.matchKey(next); render(); }
  };
  $('gw-prev').addEventListener('click', () => step(-1));
  $('gw-next').addEventListener('click', () => step(1));

  function activateRow(e) {
    const pairRow = e.target.closest('tr[data-pair]');
    if (pairRow) {
      state.pair = pairRow.dataset.pair;
      render();
      $('pair-card').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      return true;
    }
    const playerRow = e.target.closest('tr[data-player]');
    if (playerRow) {
      state.tab = 'players'; state.player = playerRow.dataset.player; state.pair = playerRow.dataset.with || '';
      render();
      if (state.pair) $('pair-card').scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
      return true;
    }
    return false;
  }
  document.addEventListener('click', (e) => { if (!e.target.closest('th')) activateRow(e); });
  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && activateRow(e)) e.preventDefault(); });
  window.addEventListener('hashchange', () => { readHash(); render(); });

  // ---------------------------------------------------------------- load
  readHash();
  fetch('matches.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      allMatches = data;
      if (!location.hash) state.year = String(E.seasons(allMatches).slice(-1)[0] ?? 'all'); // default: current season
      const latest = allMatches.slice().sort(E.byChrono).slice(-1)[0];
      if (latest) $('data-stamp').textContent = `latest: ${E.gwLabel(latest)}`;
      $('status').hidden = true;
      render();
    })
    .catch(() => { $('status').textContent = 'Couldn’t load the stats. Try refreshing.'; });
});
</script>
</body>
</html>
