<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effra Stats</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --fg: #1a1a1a; --muted: #6b6b6b;
    --card: #ffffff; --border: #e2e2e2; --accent: #1d6f42;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #eaeaea; --muted: #9a9a9a; --card: #1c1c1c; --border: #303030; --accent: #4caf7d; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  header { padding: 32px 20px 16px; max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  select#player-select {
    width: 100%; padding: 12px 14px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--fg);
  }
  main { max-width: 720px; margin: 0 auto; padding: 0 20px 60px; }
  .card {
    margin-top: 16px; padding: 18px 20px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  }
  .name { font-size: 1.3rem; font-weight: 600; margin-bottom: 10px; }
  .stats { color: var(--muted); font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 16px; }
  .stats b { color: var(--fg); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 16px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .result-W { color: var(--accent); font-weight: 600; }
  .result-L { color: #c0392b; font-weight: 600; }
  .result-D { color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); padding: 20px 0; }
</style>
</head>
<body>
<header>
  <h1>Effra Stats</h1>
  <div class="sub">Pick a player to see their record.</div>
  <select id="player-select">
    <option value="">Select a player...</option>
  </select>
  <div class="sub" style="margin-top:20px;">Or pick a gameweek to see the match.</div>
  <select id="gw-select">
    <option value="">Select a gameweek...</option>
  </select>
</header>
<main>
  <div id="player-detail"></div>
  <div id="gw-detail"></div>
</main>

<script>
let players = [];
let matches = [];

fetch('players.json').then(r => r.json()).then(data => {
  players = data;
  const select = document.getElementById('player-select');
  const sorted = data.slice().sort((a, b) => a.name.localeCompare(b.name));
  for (const p of sorted) {
    const opt = document.createElement('option');
    opt.value = p.name;
    opt.textContent = p.name;
    select.appendChild(opt);
  }
});

fetch('matches.json').then(r => r.json()).then(data => {
  matches = data;
  const select = document.getElementById('gw-select');
  const sorted = data.slice().sort((a, b) => a.gw - b.gw);
  for (const m of sorted) {
    const opt = document.createElement('option');
    opt.value = m.gw;
    opt.textContent = `GW${m.gw}`;
    select.appendChild(opt);
  }
});

document.getElementById('player-select').addEventListener('change', (e) => {
  const p = players.find(p => p.name === e.target.value);
  document.getElementById('player-detail').innerHTML = p ? renderCard(p) : '';
});

document.getElementById('gw-select').addEventListener('change', (e) => {
  const m = matches.find(m => String(m.gw) === e.target.value);
  document.getElementById('gw-detail').innerHTML = m ? renderMatch(m) : '';
});

function renderMatch(m) {
  const teamTable = (list) => `
    <table>
      <thead><tr><th>Player</th><th>G</th><th>A</th><th>CS</th><th></th></tr></thead>
      <tbody>${list.map(p => `
        <tr>
          <td>${escapeHtml(p.player)}</td>
          <td>${p.goals ?? '-'}</td>
          <td>${p.assists ?? '-'}</td>
          <td>${p.clean_sheets ?? '-'}</td>
          <td>${p.is_captain ? 'C' : ''}</td>
        </tr>
      `).join('')}</tbody>
    </table>
  `;
  return `
    <div class="card">
      <div class="name">GW${m.gw} &mdash; ${escapeHtml(m.venue || '')}</div>
      <div class="stats">
        <span class="result-${m.team1_result || ''}">Team 1: ${m.team1_result || '-'} (${m.team1_goals ?? '-'})</span>
        <span class="result-${m.team2_result || ''}">Team 2: ${m.team2_result || '-'} (${m.team2_goals ?? '-'})</span>
      </div>
      <div style="display:flex; gap:20px; flex-wrap:wrap; margin-top:10px;">
        <div style="flex:1; min-width:220px;">${teamTable(m.team1_players)}</div>
        <div style="flex:1; min-width:220px;">${teamTable(m.team2_players)}</div>
      </div>
    </div>
  `;
}

function renderCard(p) {
  const games = p.appearances || 1;
  const gpg = (p.goals / games).toFixed(2);
  const winPct = games ? Math.round((p.wins / games) * 100) : 0;
  const rows = p.games.slice().sort((a, b) => a.gw - b.gw).map(g => `
    <tr>
      <td>GW${g.gw}</td>
      <td class="result-${g.result || ''}">${g.result || '-'}</td>
      <td>${g.goals ?? '-'}</td>
      <td>${g.assists ?? '-'}</td>
      <td>${g.clean_sheets ?? '-'}</td>
      <td>${g.is_captain ? 'C' : ''}</td>
      <td>${escapeHtml(g.venue || '')}</td>
    </tr>
  `).join('');
  return `
    <div class="card">
      <div class="name">${escapeHtml(p.name)}</div>
      <div class="stats">
        <span><b>${p.appearances}</b> apps</span>
        <span><b>${p.goals}</b> goals</span>
        <span><b>${p.assists}</b> assists</span>
        <span><b>${gpg}</b> goals/game</span>
        <span><b>${winPct}%</b> win rate</span>
        <span>W <b>${p.wins}</b> D <b>${p.draws}</b> L <b>${p.losses}</b></span>
        <span><b>${p.clean_sheets}</b> clean sheets</span>
        <span><b>${p.captaincies}</b> captaincies</span>
      </div>
      <table>
        <thead><tr><th>GW</th><th>Res</th><th>G</th><th>A</th><th>CS</th><th></th><th>Venue</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
